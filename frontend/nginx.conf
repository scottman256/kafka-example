# Serves the React app and forwards each service's API, so the browser only talks to this origin.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS, looked up again every 10s: a restarted service can come back on a new IP,
    # and the page should still load while a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/transactions {
        set $transaction_service http://transaction-service:8081;
        proxy_pass $transaction_service;
    }

    location /api/risk {
        set $fraud_service http://fraud-service:8082;
        proxy_pass $fraud_service;
    }

    location /api/ledger {
        set $ledger_service http://ledger-service:8083;
        proxy_pass $ledger_service;
    }

    location / {
        try_files $uri /index.html;
    }
}
