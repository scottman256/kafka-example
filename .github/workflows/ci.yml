name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-tests:
    name: Tests and coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [transaction-service, fraud-service, ledger-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle downloads and validates the Gradle wrapper's checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Unit, slice and embedded-Kafka integration tests, then the JaCoCo gate
      # (the build fails below 90% line coverage).
      - name: Run tests and check coverage
        run: ./gradlew check

      - name: Add coverage to the job summary
        if: always() && hashFiles(format('services/{0}/build/reports/jacoco/test/jacocoTestReport.xml', matrix.service)) != ''
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          report = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          print(f"### {os.environ['SERVICE']} coverage (minimum 90% of lines)")
          for counter in report.findall("counter"):
              if counter.get("type") in ("LINE", "BRANCH"):
                  missed, covered = int(counter.get("missed")), int(counter.get("covered"))
                  print(f"- {counter.get('type').title()}: {100 * covered / (missed + covered):.1f}%")
          EOF

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/
          if-no-files-found: ignore

  end-to-end:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Run the smoke test
        run: python3 scripts/smoke_test.py

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
