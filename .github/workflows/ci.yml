name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # lets paths-filter list a pull request's changed files

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job is a required check on main. The workflow always starts, and each job after
# "Detect changes" runs only if its part of the repo changed. GitHub counts a job skipped
# by its `if` as passed, so a pull request that only touches Markdown still merges.
# (Path filters under `on:` would leave the required checks pending instead.)
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      transaction-service: ${{ steps.filter.outputs.transaction-service }}
      fraud-service: ${{ steps.filter.outputs.fraud-service }}
      ledger-service: ${{ steps.filter.outputs.ledger-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
      end-to-end: ${{ steps.filter.outputs.end-to-end }}
    steps:
      # Needed on pushes to main, where changes are found with git rather than the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A change to the pipeline itself runs everything. Markdown never counts, and nor
      # does the Bruno collection, which CI doesn't run.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            transaction-service:
              - 'services/transaction-service/**'
              - '.github/**'
              - '!**/*.md'
            fraud-service:
              - 'services/fraud-service/**'
              - '.github/**'
              - '!**/*.md'
            ledger-service:
              - 'services/ledger-service/**'
              - '.github/**'
              - '!**/*.md'
            frontend:
              - 'frontend/**'
              - '.github/**'
              - '!**/*.md'
            end-to-end:
              - '**'
              - '!**/*.md'
              - '!services/bruno/**'

  transaction-service:
    name: Tests and coverage (transaction-service)
    needs: changes
    if: needs.changes.outputs.transaction-service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle-check
        with:
          service: transaction-service

  fraud-service:
    name: Tests and coverage (fraud-service)
    needs: changes
    if: needs.changes.outputs.fraud-service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle-check
        with:
          service: fraud-service

  ledger-service:
    name: Tests and coverage (ledger-service)
    needs: changes
    if: needs.changes.outputs.ledger-service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gradle-check
        with:
          service: ledger-service

  frontend:
    name: Tests and coverage (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Type-check, then the Vitest suite and its coverage gate (fails below 90% of lines).
      - name: Type-check, run tests and check coverage
        run: npm run check

      - name: Add coverage to the job summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          summary = pathlib.Path("coverage/coverage-summary.json")
          print("### frontend coverage (minimum 90% of lines)")
          totals = json.loads(summary.read_text())["total"] if summary.exists() else {}
          for metric, label in (("lines", "Line"), ("branches", "Branch")):
              if metric in totals:
                  print(f"- {label}: {totals[metric]['pct']:.1f}%")
          print("" if totals else "No report: the tests did not finish.")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-frontend
          path: frontend/coverage/
          if-no-files-found: ignore

  end-to-end:
    name: End-to-end (Docker Compose)
    needs: changes
    if: needs.changes.outputs.end-to-end == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Check the web app is served
        run: curl --fail --silent http://localhost:3000/ | grep --quiet '<div id="root">'

      # Through nginx, so the web app's proxy routes are tested along with the services.
      - name: Run the smoke test through the web app's proxy
        env:
          TRANSACTION_SERVICE_URL: http://localhost:3000
          FRAUD_SERVICE_URL: http://localhost:3000
          LEDGER_SERVICE_URL: http://localhost:3000
        run: python3 scripts/smoke_test.py

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
